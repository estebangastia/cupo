# Throwaway Postgres for the test suite.
#
#   docker compose up -d
#   pytest
#
# Port 5433 keeps this clear of a local Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cupo
      POSTGRES_PASSWORD: cupo
      POSTGRES_DB: cupo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cupo -d cupo_test"]
      interval: 2s
      timeout: 3s
      retries: 15
