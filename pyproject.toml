[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cupo"
version = "0.1.0rc1"
description = "Usage limits, feature gates and metering for AI products"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Esteban Gastiazoro" }]
keywords = ["entitlements", "usage-metering", "rate-limiting", "llm", "saas", "billing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["asyncpg>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/estebangastia/cupo"
Issues = "https://github.com/estebangastia/cupo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cupo"]

[tool.hatch.build]
include = ["src/cupo/**/*.py", "src/cupo/schema.sql"]
