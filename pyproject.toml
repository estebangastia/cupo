[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cupo"
version = "0.0.1"
description = "Usage limits, feature gates, and metering for AI products. Drop-in for FastAPI and Next.js."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Esteban Gastiazoro" }]
keywords = ["entitlements", "metering", "usage-limits", "rate-limiting", "billing", "ai", "llm", "fastapi", "saas"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/estebangastia/cupo"
Repository = "https://github.com/estebangastia/cupo"
Issues = "https://github.com/estebangastia/cupo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cupo"]
